<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园健身搭档平台 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1571902943202-507ec2618e8f?auto=format&fit=crop&q=80&w=1932&ixlib=rb-4.0.3');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        
        .btn-login:hover {
            opacity: 0.9;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        /* 角色选择按钮样式 */
        .role-selector {
            display: flex;
            gap: 15px;
            margin-top: 12px;
        }
        
        .role-option {
            position: relative;
            flex: 1;
            text-align: center;
        }
        
        .role-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .role-label {
            display: block;
            padding: 14px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            color: #555;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .role-option input[type="radio"]:checked + .role-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #8a5cf5;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4),
                        inset 0 2px 4px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .role-option input[type="radio"]:hover + .role-label {
            border-color: #8a5cf5;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-1px);
        }
        
        .role-option input[type="radio"]:active + .role-label {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>校园健身搭档平台</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>用户角色</label>
                <div class="role-selector">
                    <div class="role-option">
                        <input type="radio" name="role" value="user" id="role-user" checked>
                        <label for="role-user" class="role-label">普通用户</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" name="role" value="admin" id="role-admin">
                        <label for="role-admin" class="role-label">管理员</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-login">登录</button>
        </form>
        <div class="login-footer">
            <p>还没有账号？<a href="register.html">立即注册</a></p>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            
            // 这里可以添加表单验证逻辑
            if (!username || !password) {
                alert('请输入用户名和密码');
                return;
            }
            
            // 发送AJAX请求调用登录接口
            fetch('/user/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: username, password: password, role: role })
            })
            .then(response => response.text())
            .then(data => {
                // 解析返回的用户ID和登录信息
                if (data.includes(':')) {
                    const [userId, message] = data.split(':');
                    alert(message);
                    // 登录成功后保存用户名、用户ID和角色到localStorage
                    localStorage.setItem('username', username);
                    localStorage.setItem('userId', userId);
                    localStorage.setItem('userRole', role);
                    // 跳转到主页面
                    window.location.href = `main.html`;
                } else {
                    alert(data);
                }
            })
            .catch(error => {
                console.error('登录请求失败:', error);
                alert('登录请求失败，请稍后重试');
            });
        });
    </script>
</body>
</html>
